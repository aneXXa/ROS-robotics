name: ROS checks

on: [push, pull_request]

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w06-6eda53e1c566.tar.gz
  COURSE_KIT_SHA256: 6eda53e1c566f7f0a7e09d7afe1e5a6f3b98397175a7e57dede9a84c6d14d0fe

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit

      - name: Adapt Pose depend for Jazzy
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          if ! ros2 pkg prefix turtlesim_msgs >/dev/null 2>&1; then
            sed -i 's/<depend>turtlesim_msgs<\/depend>/<depend>turtlesim<\/depend>/' src/patrol/package.xml
            sed -i 's/<depend>turtlesim_msgs<\/depend>/<depend>turtlesim<\/depend>/' src/course_bringup/package.xml
          fi

      - name: Build packages
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup patrol course_bringup
          test -f install/turtle_bringup/share/turtle_bringup/launch/sim.launch.py
          test -f install/patrol/lib/patrol/patrol
          test -f install/course_bringup/share/course_bringup/launch/patrol.launch.py
          test -f install/course_bringup/lib/course_bringup/pose_relay

      - name: Unit tests patrol
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          python3 -m pytest src/patrol/test -v

      - name: Check PR05 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR05 --submission .
