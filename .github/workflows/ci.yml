name: ROS checks

on: [push, pull_request]

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w07-9b7fdd5424d3.tar.gz
  COURSE_KIT_SHA256: 9b7fdd5424d3d97e47d51dbe23064934585e62135dc2902844dd679529bda929

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit

      - name: Install PR07 deps (Jazzy)
        shell: bash
        run: |
          apt-get update
          apt-get install -y "ros-${ROS_DISTRO}-ackermann-msgs" "ros-${ROS_DISTRO}-ros-gz" || true

      - name: Adapt Pose depend for Jazzy
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          if ! ros2 pkg prefix turtlesim_msgs >/dev/null 2>&1; then
            sed -i 's/<depend>turtlesim_msgs<\/depend>/<depend>turtlesim<\/depend>/' src/patrol/package.xml
            sed -i 's/<depend>turtlesim_msgs<\/depend>/<depend>turtlesim<\/depend>/' src/course_bringup/package.xml
          fi

      - name: Build packages
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          colcon build --symlink-install --packages-up-to course_simulation
          test -f install/course_simulation/share/course_simulation/launch/simulation.launch.py
          test -f install/course_simulation/lib/course_simulation/drive_adapter
          test -f install/course_simulation/lib/course_simulation/odom_adapter

      - name: Unit tests
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          python3 -m pytest src/patrol/test src/course_description/test src/course_simulation/test -v

      - name: Check PR07 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR07 --submission .
