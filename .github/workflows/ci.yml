name: ROS checks

on: [push, pull_request]

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w01-57866a9c98fa.tar.gz
  COURSE_KIT_SHA256: 57866a9c98fa3abdec27b35a180697ee680bfb0f05cc015970ce306d6d849fea

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit

      - name: Ensure PR02 manifest
        shell: bash
        run: |
          printf '%s\n' '{"id":"PR02","required_paths":["src/turtle_bringup/package.xml","src/turtle_bringup/setup.py","src/turtle_bringup/setup.cfg","src/turtle_bringup/resource/turtle_bringup","src/turtle_bringup/launch/sim.launch.py","evidence/pr02/build-empty.txt","evidence/pr02/build.txt","evidence/pr02/commands.md","evidence/pr02/types.md","evidence/pr02/report.json"],"required_claims":["public_tests_passed","defect_reproduced","defect_fixed"]}' \
            > .course-kit/v1/practices/manifests/pr02.json

      - name: Compile launch file
        shell: bash
        run: python3 -m py_compile src/turtle_bringup/launch/sim.launch.py

      - name: Build turtle_bringup
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup
          test -f install/turtle_bringup/share/turtle_bringup/launch/sim.launch.py

      - name: Check PR02 evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR02 --submission .
